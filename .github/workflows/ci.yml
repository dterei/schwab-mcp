name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new Go vulnerabilities and releases show up between pushes.
    - cron: '23 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older runs. Every other run (main,
# the weekly schedule, manual runs) gets a group of its own and finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Go ${{ matrix.go }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # The oldest Go release still supported, which go.mod requires.
          - os: ubuntu-latest
            go: oldstable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -shuffle=on ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # golangci-lint only understands Go releases up to the one it was built
      # with, so this Go version moves together with the golangci-lint
      # version below and the one in the Makefile.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Check modernc.org/libc is the one modernc.org/sqlite requires
        run: make libc
      # Runs the linters and formatters in .golangci.yml, go vet included.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      # ShellCheck comes with the Ubuntu runner.
      - name: Check the shell scripts
        run: shellcheck cmd/schwabtx/schedule/*.sh

  # A client built on the TypeScript MCP SDK compiles the output schema of
  # every tool with Ajv as it lists the tools, and one schema that Ajv cannot
  # compile costs it every tool of the server. This compiles each schema the
  # MCP server serves, from the goldens that TestSchemaGoldens holds to what
  # it serves, with Ajv set up as that SDK sets it up (scripts/ajvcheck).
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node and npm come with the Ubuntu runner. package-lock.json pins Ajv
      # and ajv-formats, with their integrity.
      - name: Install Ajv
        working-directory: scripts/ajvcheck
        run: npm ci --ignore-scripts
      - name: Compile the MCP server's schemas with Ajv
        run: node scripts/ajvcheck/check.mjs internal/mcpserver/testdata/schemas/*.json

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
