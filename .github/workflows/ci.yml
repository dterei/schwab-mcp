name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new Go vulnerabilities and releases show up between pushes.
    - cron: '23 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older runs. Every other run (main,
# the weekly schedule, manual runs) gets a group of its own and finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Go ${{ matrix.go }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # The oldest Go release still supported, which go.mod requires.
          - os: ubuntu-latest
            go: oldstable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -shuffle=on ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # golangci-lint only understands Go releases up to the one it was built
      # with, so this Go version moves together with the golangci-lint
      # version below and the one in the Makefile.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      # Runs the linters and formatters in .golangci.yml, go vet included.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      # ShellCheck comes with the Ubuntu runner.
      - name: Check the shell scripts
        run: shellcheck cmd/schwabtx/schedule/*.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
