version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before adopting them. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
    # modernc.org/sqlite must build with exactly the libc its own go.mod
    # requires, so libc moves only when sqlite does (make libc checks it).
    ignore:
      - dependency-name: modernc.org/libc
    groups:
      go-modules:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  # Ajv and ajv-formats for CI's schemas job, which compiles the MCP server's
  # schemas as clients built on the TypeScript MCP SDK do. That SDK takes
  # ajv ^8.17.1 and ajv-formats ^3.0.1, so a new major version would reach
  # no such client until the SDK moves to it.
  - package-ecosystem: npm
    directory: /scripts/ajvcheck
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      ajvcheck:
        patterns: ['*']
