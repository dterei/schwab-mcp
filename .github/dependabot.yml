version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before adopting them. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
    # modernc.org/sqlite must build with exactly the libc its own go.mod
    # requires, so libc moves only when sqlite does (make libc checks it).
    ignore:
      - dependency-name: modernc.org/libc
    groups:
      go-modules:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
