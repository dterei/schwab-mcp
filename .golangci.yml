version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - durationcheck
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    depguard:
      rules:
        # The fake Schwab is a package that tests import. go build compiles
        # it as a library, so it would not notice a program importing it.
        schwabtest:
          files: ["!$test"]
          deny:
            - pkg: github.com/dterei/schwab-mcp/internal/schwab/schwabtest
              desc: the fake Schwab is for tests only
        # The store, the calendar and the masking work only on what they
        # are given; reading from Schwab is the client's job. The list names
        # net itself and each package of the standard library that dials
        # without importing it here; net/url, which the store needs for its
        # file: URIs, and net/netip stay allowed.
        offline:
          files:
            - "**/internal/history/**"
            - "**/internal/nyse/**"
            - "**/internal/nytime/**"
            - "**/internal/mask/**"
          deny:
            - pkg: net$
              desc: this package does not reach the network
            - pkg: net/http
              desc: this package does not reach the network
            - pkg: net/rpc
              desc: this package does not reach the network
            - pkg: net/smtp
              desc: this package does not reach the network
            - pkg: net/textproto
              desc: this package does not reach the network
            - pkg: crypto/tls
              desc: this package does not reach the network
            - pkg: log/syslog
              desc: this package does not reach the network
    forbidigo:
      # Analyze types, so that a renamed import of os is caught too.
      analyze-types: true
      forbid:
        # A process that has the store open must not open the store's files
        # by path: on Linux and macOS, closing any descriptor of a file drops
        # the locks that SQLite holds on it. Only internal/history is held
        # to this (see the exclusions below); each exception there says why
        # in a nolint:forbidigo comment.
        - pattern: ^os\.(Open|OpenFile|ReadFile|Create|WriteFile|OpenInRoot|OpenRoot|DirFS)$
          msg: the store's files are opened only by SQLite; take contents, not paths
        # The MCP server holds the store open too, and keeps to conventions
        # of its own, which internal/mcpserver's package doc states. Only
        # the server's packages are held to these rules, whose messages
        # start "MCP server:" (see the exclusions below); the two places
        # where cmd/schwab-mcp must touch os.Stdout each say why.
        - pattern: ^(fmt\.Print(f|ln)?|os\.Stdout|print|println)$
          msg: "MCP server: stdout carries the protocol alone; use the server's logger"
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: "MCP server: log through the server's logger"
        - pattern: ^json\.(Marshal|MarshalIndent)$
          msg: "MCP server: encode output with encode(), which does not escape HTML"
        - pattern: ^history\.Open$
          pkg: ^github\.com/dterei/schwab-mcp/internal/history$
          msg: "MCP server: open the store with history.OpenReader, which cannot write"
        - pattern: ^mcp\.(AddTool|ResourceNotFoundError)$
          pkg: ^github\.com/modelcontextprotocol/go-sdk/mcp$
          msg: "MCP server: register tools with addTool; never echo a URI in an error"
        - pattern: ^schwab\.Auth\.(Login|AuthorizeURL)$
          pkg: ^github\.com/dterei/schwab-mcp/internal/schwab$
          msg: "MCP server: the server never logs in"
    nolintlint:
      require-specific: true
      require-explanation: true
    gosec:
      excludes:
        # Unchecked errors are errcheck's job, which knows the safe cases.
        - G104
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests use fake credentials and temp-dir paths on purpose.
      - path: _test\.go
        linters: [gosec]
      # Only the store and the MCP server, which holds the store open, are
      # kept from opening files by path, and only the server's packages are
      # held to its conventions. Each rule is scoped by its message, since a
      # path-except rule without one would drop every other rule's issues
      # outside its path. Tests may do all of it.
      - path-except: ^(internal/history|internal/mcpserver|cmd/schwab-mcp)/
        text: "the store's files are opened only by SQLite"
        linters: [forbidigo]
      - path-except: ^(internal/mcpserver|cmd/schwab-mcp)/
        text: "MCP server:"
        linters: [forbidigo]
      - path: _test\.go
        linters: [forbidigo]
      # Schwab is a proper noun, so an error message may start with it.
      - linters: [staticcheck]
        text: ST1005
        source: '"Schwab'

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dterei/schwab-mcp
